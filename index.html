<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學遊戲入口</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#dbe3ee;--accent:#2563eb}
    *{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 55%,#f8fafc 100%);color:var(--text);min-height:100vh}.wrap{width:min(1080px,94vw);margin:0 auto;padding:42px 0 60px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 10px}.hero p{color:var(--muted);margin:0;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.game-card{display:flex;flex-direction:column;min-height:230px;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:0 10px 28px rgba(15,23,42,.06);text-decoration:none;color:inherit;transition:.18s ease}.game-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(15,23,42,.10);border-color:#bfd0eb}.icon{font-size:54px;line-height:1;margin-bottom:16px}.game-card h2{margin:0 0 8px;font-size:24px}.game-card p{color:var(--muted);line-height:1.65;margin:0 0 18px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.tag{background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}.play{margin-top:16px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.status{text-align:center;color:var(--muted);padding:30px 0}.error{color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:14px;text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🎮 數學遊戲樂園</h1>
      <p>選擇一個遊戲開始挑戰。之後新增遊戲時，不需要修改這個入口頁面的程式。</p>
    </section>
    <section id="gameGrid" class="grid"><div class="status">正在載入遊戲...</div></section>
  </main>
  <script>
    const gameGrid=document.getElementById('gameGrid');
    function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
    async function loadGames(){
      try{
        const response=await fetch('games.json',{cache:'no-store'});
        if(!response.ok) throw new Error('games.json 讀取失敗');
        const games=await response.json();
        const enabledGames=games.filter(game=>game.enabled!==false);
        if(enabledGames.length===0){gameGrid.innerHTML='<div class="status">目前沒有可玩的遊戲。</div>';return}
        gameGrid.innerHTML=enabledGames.map(game=>`<a class="game-card" href="${escapeHtml(game.path)}"><div class="icon">${escapeHtml(game.icon||'🎯')}</div><h2>${escapeHtml(game.title)}</h2><p>${escapeHtml(game.description||'')}</p><div class="tags">${game.grade?`<span class="tag">${escapeHtml(game.grade)}</span>`:''}${game.subject?`<span class="tag">${escapeHtml(game.subject)}</span>`:''}</div><div class="play">開始遊戲 →</div></a>`).join('');
      }catch(error){console.error(error);gameGrid.innerHTML='<div class="error">入口頁讀不到 games.json。請確認 games.json 和 index.html 放在同一層。</div>'}
    }
    loadGames();
  </script>
</body>
</html>
