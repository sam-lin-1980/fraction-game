<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>數學遊戲樂園</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#dbe3ee;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 55%,#f8fafc 100%)}
.wrap{width:min(1180px,94vw);margin:auto;padding:38px 0 60px}.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 10px}.hero p{color:var(--muted);line-height:1.7;margin:0}.db-note{max-width:820px;margin:18px auto 0;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--muted);font-size:14px}.grade-title{margin:30px 0 14px;font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.game-card{display:flex;flex-direction:column;min-height:345px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--border);box-shadow:0 10px 28px rgba(15,23,42,.06)}.card-head{display:flex;gap:14px}.icon{font-size:48px;line-height:1}.game-card h2{font-size:22px;margin:0 0 6px}.desc{color:var(--muted);margin:0;line-height:1.55}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.tag{background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.rank{margin-top:auto;border-top:1px solid var(--border);padding-top:13px}.rank h3{margin:0 0 8px;font-size:16px}.rank-row{display:grid;grid-template-columns:34px 1fr auto auto;gap:7px;align-items:center;padding:6px 0;border-bottom:1px dashed #e5e7eb;font-size:14px}.rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.rank-score{font-weight:800}.rank-time{color:var(--muted);font-size:12px}.empty{color:var(--muted);font-size:14px;padding:8px 0}.play{display:flex;justify-content:center;align-items:center;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.error{color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:14px;text-align:center}
</style>
</head>
<body><main class="wrap"><section class="hero"><h1>🎮 數學遊戲樂園</h1><p>選擇遊戲開始挑戰；每張遊戲卡會顯示自己的排行榜。</p><div id="dbNote" class="db-note">正在檢查排行榜連線...</div>
      <div id="debugBox" class="db-note" style="text-align:left;line-height:1.7">
        <b>Supabase 偵錯資訊</b><br>
        config.js 是否載入：<span id="dbgConfig">檢查中...</span><br>
        Project URL：<span id="dbgUrl">檢查中...</span><br>
        Publishable key：<span id="dbgKey">檢查中...</span><br>
        Supabase client：<span id="dbgClient">檢查中...</span>
      </div></section><div id="catalog"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js?v=20261003-2"></script>
<script>
const catalog=document.getElementById('catalog'),dbNote=document.getElementById('dbNote');
const dbgConfig=document.getElementById('dbgConfig');
const dbgUrl=document.getElementById('dbgUrl');
const dbgKey=document.getElementById('dbgKey');
const dbgClient=document.getElementById('dbgClient');

const cfg=window.GAME_PORTAL_CONFIG||{};
const hasConfig = !!window.GAME_PORTAL_CONFIG;
const urlOk = typeof cfg.SUPABASE_URL === 'string' &&
              cfg.SUPABASE_URL.startsWith('https://') &&
              cfg.SUPABASE_URL.includes('.supabase.co');
const keyOk = typeof cfg.SUPABASE_KEY === 'string' &&
              cfg.SUPABASE_KEY.startsWith('sb_publishable_');
const dbReady = hasConfig && urlOk && keyOk;

let db = null;
let clientOk = false;
try{
  if(dbReady){
    db = supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
    clientOk = !!db;
  }
}catch(e){
  console.error('Supabase createClient error:', e);
}

dbgConfig.textContent = hasConfig ? '✅ 已載入' : '❌ 未載入';
dbgUrl.textContent = urlOk ? '✅ 格式正常' : '❌ 格式異常或不存在';
dbgKey.textContent = keyOk ? '✅ 格式正常' : '❌ 格式異常或不存在';
dbgClient.textContent = clientOk ? '✅ 已建立' : '❌ 未建立';
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function fmtTime(sec){sec=Number(sec)||0;const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return `${m}:${s}`}
async function getRank(game){if(!db)return[];const modes=Array.isArray(game.modes)&&game.modes.length?game.modes:[game.id];const {data,error}=await db.from('scores').select('player_id,player_name,score,time_seconds,mode').eq('completed',true).in('mode',modes).order('score',{ascending:false}).order('time_seconds',{ascending:true}).limit(100);if(error)throw error;const unique=[],seen=new Set();for(const row of(data||[])){const key=row.player_id||`name:${row.player_name}`;if(seen.has(key))continue;seen.add(key);unique.push(row);if(unique.length>=3)break}return unique}
function rankHtml(rows){if(!rows.length)return'<div class="empty">尚無排行榜資料</div>';const medals=['🥇','🥈','🥉'];return rows.map((r,i)=>`<div class="rank-row"><span>${medals[i]}</span><span class="rank-name">${esc(r.player_name)}</span><span class="rank-score">${r.score} 分</span><span class="rank-time">${fmtTime(r.time_seconds)}</span></div>`).join('')}
async function load(){try{const res=await fetch('games.json',{cache:'no-store'});if(!res.ok)throw new Error('games.json 讀取失敗');const games=(await res.json()).filter(g=>g.enabled!==false);const groups=new Map();for(const g of games){const grade=g.grade||'其他';if(!groups.has(grade))groups.set(grade,[]);groups.get(grade).push(g)}catalog.innerHTML=[...groups.entries()].map(([grade,items])=>`<section><h2 class="grade-title">📚 ${esc(grade)}</h2><div class="grid">${items.map(g=>`<article class="game-card"><div class="card-head"><div class="icon">${esc(g.icon||'🎯')}</div><div><h2>${esc(g.title)}</h2><p class="desc">${esc(g.description||'')}</p></div></div><div class="tags"><span class="tag">${esc(g.grade||'')}</span><span class="tag">${esc(g.subject||'')}</span></div><div class="rank"><h3>🏆 排行榜 Top 3</h3><div id="rank-${esc(g.id)}" class="empty">${db?'讀取中...':'尚未設定 Supabase'}</div></div><a class="play" href="${esc(g.path)}">開始遊戲 →</a></article>`).join('')}</div></section>`).join('');if(!db){
      if(!hasConfig){
        dbNote.innerHTML='❌ config.js 沒有成功載入。請確認 index.html 與 config.js 在同一層，並重新整理。';
      }else if(!urlOk){
        dbNote.innerHTML='❌ config.js 已載入，但 Project URL 格式不正確。';
      }else if(!keyOk){
        dbNote.innerHTML='❌ config.js 已載入，但 Publishable key 格式不正確。';
      }else{
        dbNote.innerHTML='❌ Supabase client 建立失敗。';
      }
      return
    }dbNote.textContent='✅ 排行榜已連接 Supabase。';await Promise.all(games.map(async g=>{const box=document.getElementById(`rank-${g.id}`);try{box.className='';box.innerHTML=rankHtml(await getRank(g))}catch(e){console.error(e);box.className='empty';box.textContent='排行榜讀取失敗'}}))}catch(e){console.error(e);catalog.innerHTML='<div class="error">入口網站讀取失敗，請確認 games.json 與 index.html 在同一層。</div>'}}
load();
</script></body></html>
